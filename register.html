<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রক্তদাতা নিবন্ধন | রক্ত বন্ধন রৌমারী</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #292929;
}

header {
  background: #b5121b;
  color: white;
  text-align: center;
  padding: 25px 12px;
}

header h2 {
  margin: 0 0 7px;
  font-size: 25px;
}

header p {
  margin: 0;
  font-size: 14px;
}

.container {
  max-width: 550px;
  margin: 25px auto;
  padding: 25px 20px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

h3 {
  color: #b5121b;
  text-align: center;
  margin-top: 0;
  margin-bottom: 22px;
  font-size: 23px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
  font-size: 14px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

input:focus, select:focus {
  outline: none;
  border-color: #b5121b;
}

input[readonly] {
  background: #eeeeee;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-top: 20px;
  line-height: 1.6;
  font-size: 14px;
}

.consent input {
  width: 18px;
  height: 18px;
  margin-top: 2px;
  flex-shrink: 0;
}

button {
  width: 100%;
  padding: 14px;
  background: #b5121b;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 22px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#message {
  text-align: center;
  font-size: 14px;
  margin-top: 15px;
  line-height: 1.6;
}

.home {
  display: block;
  text-align: center;
  color: #b5121b;
  margin-top: 20px;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h2>রক্ত বন্ধন রৌমারী</h2>
  <p>রক্তের প্রয়োজনে, মানুষের পাশে।</p>
</header>

<div class="container">

  <h3>রক্তদাতা নিবন্ধন</h3>

  <form id="donorForm">

    <label>আপনার নাম *</label>
    <input id="name" type="text" required maxlength="80"
    placeholder="আপনার সম্পূর্ণ নাম">

    <label>মোবাইল নম্বর *</label>
    <input id="phone" type="tel" required minlength="8" maxlength="20"
    placeholder="01XXXXXXXXX">

    <label>রক্তের গ্রুপ *</label>
    <select id="bloodGroup" required>
      <option value="">রক্তের গ্রুপ নির্বাচন করুন</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>

    <label>দেশ</label>
    <input type="text" value="বাংলাদেশ" readonly>

    <label>বিভাগ</label>
    <input type="text" value="রংপুর" readonly>

    <label>জেলা</label>
    <input type="text" value="কুড়িগ্রাম" readonly>

    <label>উপজেলা *</label>
    <select id="upazila" required>
      <option value="">উপজেলা নির্বাচন করুন</option>
      <option value="কুড়িগ্রাম সদর">কুড়িগ্রাম সদর</option>
      <option value="ভূরুঙ্গামারী">ভূরুঙ্গামারী</option>
      <option value="নাগেশ্বরী">নাগেশ্বরী</option>
      <option value="ফুলবাড়ী">ফুলবাড়ী</option>
      <option value="রাজারহাট">রাজারহাট</option>
      <option value="উলিপুর">উলিপুর</option>
      <option value="চিলমারী">চিলমারী</option>
      <option value="রৌমারী">রৌমারী</option>
      <option value="চর রাজিবপুর">চর রাজিবপুর</option>
    </select>

    <label>ইউনিয়ন *</label>
    <select id="union" required disabled>
      <option value="">প্রথমে উপজেলা নির্বাচন করুন</option>
    </select>

    <label>ওয়ার্ড নম্বর *</label>
    <select id="ward" required>
      <option value="">ওয়ার্ড নির্বাচন করুন</option>
      <option value="১">১</option>
      <option value="২">২</option>
      <option value="৩">৩</option>
      <option value="৪">৪</option>
      <option value="৫">৫</option>
      <option value="৬">৬</option>
      <option value="৭">৭</option>
      <option value="৮">৮</option>
      <option value="৯">৯</option>
      <option value="জানা নেই">জানা নেই</option>
    </select>

    <label>গ্রামের নাম *</label>
    <input id="village" type="text" required maxlength="100"
    placeholder="আপনার গ্রামের নাম লিখুন">

    <label>ফেসবুক প্রোফাইল লিংক (ঐচ্ছিক)</label>
    <input id="facebook" type="url" maxlength="500"
    placeholder="https://facebook.com/...">

    <label>সর্বশেষ রক্তদানের তারিখ (ঐচ্ছিক)</label>
    <input id="lastDonation" type="date">

    <div class="consent">
      <input id="consent" type="checkbox" required>
      <span>
        আমি সম্মতি দিচ্ছি যে আমার নাম, রক্তের গ্রুপ,
        ঠিকানা ও মোবাইল নম্বর ওয়েবসাইটে প্রকাশ করা যাবে
        এবং রক্তের প্রয়োজনে আমার সঙ্গে যোগাযোগ করা যাবে।
      </span>
    </div>

    <button id="submitBtn" type="submit">
      নিবন্ধন করুন
    </button>

    <p id="message"></p>

  </form>

  <a class="home" href="index.html">
    হোম পেজে ফিরে যান
  </a>

</div>

<footer>
  © রক্ত বন্ধন রৌমারী | স্বেচ্ছায় রক্তদানের উদ্যোগ
</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import { getAuth, signInAnonymously, signOut }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import { getFirestore, doc, setDoc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAICYgFvCdrd009JrQwgTthQ4R5oxhGoY8",
  authDomain: "rokto-bondhon-roumari.firebaseapp.com",
  projectId: "rokto-bondhon-roumari",
  storageBucket: "rokto-bondhon-roumari.firebasestorage.app",
  messagingSenderId: "635710402171",
  appId: "1:635710402171:web:e5c25d42d0eed8af50bcde",
  measurementId: "G-70BP42NXBF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("donorForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");
const upazilaSelect = document.getElementById("upazila");
const unionSelect = document.getElementById("union");

// Rules-এর সঙ্গে হুবহু মিল রেখে উপজেলার ইউনিয়ন তালিকা
const unions = {
  "কুড়িগ্রাম সদর": [
    "কাঁঠালবাড়ী", "হলোখানা", "ভোগডাঙ্গা", "ঘোগাদহ",
    "বেলগাছা", "মোগলবাসা", "পাঁচগাছি", "যাত্রাপুর"
  ],

  "ভূরুঙ্গামারী": [
    "পাথরডুবি", "শিলখুড়ি", "তিলাই", "পাইকেরছড়া",
    "ভুরুঙ্গামারী", "জয়মনিরহাট", "আন্ধারীঝাড়",
    "বলদিয়া", "চর-ভূরুঙ্গামারী", "বঙ্গসোনাহাট"
  ],

  "নাগেশ্বরী": [
    "রামখানা", "রায়গঞ্জ", "বামনডাঙ্গা", "বেরুবাড়ী",
    "সন্তোষপুর", "নেওয়াশী", "হাসনাবাদ", "ভিতরবন্দ",
    "কালীগঞ্জ", "নুনখাওয়া", "নারায়ণপুর",
    "বল্লভেরখাস", "কেদার", "কচাকাটা"
  ],

  "ফুলবাড়ী": [
    "শিমুলবাড়ী", "নাওডাঙ্গা", "ভাঙ্গামোড়",
    "ফুলবাড়ী", "কাশিপুর", "বড়ভিটা"
  ],

  "রাজারহাট": [
    "ঘড়িয়ালডাঙ্গা", "ছিনাই", "রাজারহাট",
    "চাকিরপশার", "বিদ্যানন্দ", "উমরমজিদ", "নজিমখাঁন"
  ],

  "উলিপুর": [
    "গুনাইগাছ", "দলদলিয়া", "দুর্গাপুর", "তবকপুর",
    "বুড়াবুড়ী", "পান্ডুল", "ধামশ্রেণী", "ধরণীবাড়ী",
    "থেতরাই", "হাতিয়া", "বজরা", "বেগমগঞ্জ",
    "সাহেবের আলগা"
  ],

  "চিলমারী": [
    "থানাহাট", "রাণীগঞ্জ", "রমনা",
    "চিলমারী", "অষ্টমীর চর", "নয়ারহাট"
  ],

  "রৌমারী": [
    "বন্দবেড়", "শৌলমারী", "রৌমারী",
    "দাঁতভাঙ্গা", "যাদুরচর", "চর শৌলমারী"
  ],

  "চর রাজিবপুর": [
    "রাজিবপুর", "কোদালকাটি", "মোহনগঞ্জ"
  ]
};

// উপজেলা অনুযায়ী ইউনিয়ন দেখানো
upazilaSelect.addEventListener("change", function() {

  const selectedUpazila = upazilaSelect.value;

  unionSelect.innerHTML = "";

  const firstOption = document.createElement("option");
  firstOption.value = "";
  firstOption.textContent = "ইউনিয়ন নির্বাচন করুন";
  unionSelect.appendChild(firstOption);

  if (!selectedUpazila || !unions[selectedUpazila]) {
    unionSelect.disabled = true;
    return;
  }

  unions[selectedUpazila].forEach(function(unionName) {
    const option = document.createElement("option");
    option.value = unionName;
    option.textContent = unionName;
    unionSelect.appendChild(option);
  });

  unionSelect.disabled = false;
});

// নিবন্ধন
form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!form.reportValidity()) {
    return;
  }

  if (!document.getElementById("consent").checked) {
    message.textContent = "ফোন নম্বর প্রকাশের সম্মতি প্রয়োজন।";
    message.style.color = "red";
    return;
  }

  button.disabled = true;
  button.textContent = "নিবন্ধন হচ্ছে...";
  message.textContent = "";

  try {
await signOut(auth);
    const credential = await signInAnonymously(auth);
    const user = credential.user;

    const donorData = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      bloodGroup: document.getElementById("bloodGroup").value,
      district: "কুড়িগ্রাম",
      upazila: upazilaSelect.value,
      union: unionSelect.value,
      ward: document.getElementById("ward").value,
      village: document.getElementById("village").value.trim(),
      facebook: document.getElementById("facebook").value.trim(),
      lastDonation: document.getElementById("lastDonation").value,
      consent: true,
      createdAt: serverTimestamp()
    };

    await setDoc(doc(db, "donors", user.uid), donorData);

    message.textContent = "নিবন্ধন সফল হয়েছে। ধন্যবাদ!";
    message.style.color = "green";
    form.reset();

    unionSelect.innerHTML =
      '<option value="">প্রথমে উপজেলা নির্বাচন করুন</option>';
    unionSelect.disabled = true;

  } catch (error) {

    console.error(error);

    message.textContent =
      "নিবন্ধন হয়নি। আবার চেষ্টা করুন। Error: " + error.code;

    message.style.color = "red";

  } finally {

    button.disabled = false;
    button.textContent = "নিবন্ধন করুন";

  }
});

</script>

</body>
</html>
